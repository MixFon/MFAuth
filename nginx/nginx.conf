events {
    # Максимальное количество одновременных соединений на один worker-процесс.
    # 1024 достаточно для небольшого VPS с одним ядром.
    worker_connections 1024;
}

http {
    # Не показывать версию nginx в заголовках ответа и страницах ошибок.
    # Меньше информации для потенциального атакующего.
    server_tokens off;

    # ==========================================================================
    # Сервер 1: HTTP → HTTPS редирект
    # Принимает все запросы на порт 80 и перенаправляет на HTTPS.
    # Let's Encrypt также использует порт 80 для верификации домена (ACME challenge).
    # ==========================================================================
    server {
        listen 80;

        # Замени на свой домен.
        server_name yourdomain.com;

        # 301 — постоянный редирект. Браузер и клиент запомнят и будут сразу идти на HTTPS.
        return 301 https://$host$request_uri;
    }

    # ==========================================================================
    # Сервер 2: HTTPS → mfauth reverse proxy
    # Принимает зашифрованные запросы, расшифровывает и проксирует на mfauth:8080.
    # mfauth работает по обычному HTTP внутри Docker-сети — TLS здесь не нужен.
    # ==========================================================================
    server {
        listen 443 ssl;

        # Замени на свой домен.
        server_name yourdomain.com;

        # Пути к сертификатам Let's Encrypt.
        # Certbot кладёт их сюда автоматически после верификации домена.
        # fullchain.pem — сертификат + цепочка до корневого CA.
        # privkey.pem   — приватный ключ.
        ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        # Разрешаем только TLS 1.2 и 1.3 — старые версии (1.0, 1.1) уязвимы.
        ssl_protocols TLSv1.2 TLSv1.3;

        # Современный набор шифров — хороший баланс между безопасностью и совместимостью.
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            # Проксируем запросы на mfauth по имени сервиса Docker-сети.
            # Снаружи порт 8080 не открыт — только nginx имеет к нему доступ.
            proxy_pass http://mfauth:8080;

            # Передаём оригинальные заголовки запроса в mfauth.
            # Без этого сервис видит адрес nginx вместо реального IP клиента.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Сообщаем mfauth что оригинальный запрос пришёл по HTTPS.
            # Полезно если сервис формирует ссылки или проверяет схему запроса.
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
